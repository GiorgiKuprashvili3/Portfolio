<section class="hero">
  <div class="hero__tag">available for hire</div>

  <h1
    class="hero__name"
    (mouseenter)="onNameEnter()"
    (mouseleave)="onNameLeave()"
  >
    {{ displayFirst() }}<br>
    <span>{{ displayLast() }}</span>
  </h1>

  <p class="hero__sub">
    <span class="hero__sub-prefix">// </span>

    <span
      class="hero__spec hero__spec--fe"
      (mouseenter)="hoveredSpec.set('fe')"
      (mouseleave)="hoveredSpec.set(null)"
    >
      frontend_dev
      <span class="hero__skill-cloud" [class.hero__skill-cloud--visible]="hoveredSpec() === 'fe'">
        <span
          *ngFor="let s of feSkills; let i = index"
          class="hero__skill-chip tag tag--fe"
          [style.--i]="i"
        >{{ s.label }}</span>
      </span>
    </span>

    <span class="hero__sub-sep"> + </span>

    <span
      class="hero__spec hero__spec--da"
      (mouseenter)="hoveredSpec.set('da')"
      (mouseleave)="hoveredSpec.set(null)"
    >
      data_analyst
      <span class="hero__skill-cloud" [class.hero__skill-cloud--visible]="hoveredSpec() === 'da'">
        <span
          *ngFor="let s of daSkills; let i = index"
          class="hero__skill-chip tag tag--da"
          [style.--i]="i"
        >{{ s.label }}</span>
      </span>
    </span>
  </p>

  <p class="hero__desc">
    Building fast, responsive web interfaces with Angular &amp; React.
    Turning raw data into insights with Python, Pandas, and Matplotlib.
    Tbilisi, Georgia.
  </p>

  <div class="hero__btns">
    <a href="assets/Giorgi_Kuprashvili_CV.pdf" download class="btn btn--primary">
      <i class="ti ti-download" aria-hidden="true"></i> Download CV
    </a>
    <a href="https://github.com/" target="_blank" rel="noopener" class="btn btn--outline">
      <i class="ti ti-brand-github" aria-hidden="true"></i> GitHub
    </a>
  </div>
</section>
