<article class="hotel-card">

  <!-- HEADER -->
  <header class="hotel-head">
    <div class="hotel-head__left">
      <div class="hotel-head__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div class="hotel-head__text">
        <h1>Hotel Booking — Live Preview</h1>
        <p>Angular · TypeScript · SCSS · Vercel</p>
      </div>
    </div>

    <div class="hotel-head__right">
      <ul class="hotel-tags">
        <li data-tone="blue">Angular</li>
        <li data-tone="cyan">TypeScript</li>
        <li data-tone="green">Live</li>
      </ul>
      <div class="hotel-head__actions">
        <a [href]="repoUrl" target="_blank" rel="noopener" class="hotel-action-link">
          <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </a>
        <a [href]="liveUrl" target="_blank" rel="noopener" class="hotel-action-link hotel-action-link--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Open tab
        </a>
      </div>
      <a class="hotel-close" aria-label="Close" (click)="close.emit()" style="cursor:pointer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- IFRAME PREVIEW -->
  <div class="hotel-iframe-wrap">
    <div class="hotel-iframe-loader" *ngIf="!loaded()">
      <span class="loader-ring"></span>
      <p>Loading live preview…</p>
    </div>
    <iframe
      [src]="safeUrl"
      class="hotel-iframe"
      [class.hotel-iframe--visible]="loaded()"
      title="Hotel Booking Live Preview"
      loading="lazy"
      (load)="onIframeLoad()"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
    </iframe>
  </div>

</article>
