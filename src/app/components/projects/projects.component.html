<section id="projects" class="projects-section">
  
  <header class="hud-header">
    <div class="hud-target-box">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <h2 class="hud-title">ACTIVE_PROJECTS</h2>
    </div>
    
    <div class="hud-controls">
      <button 
        *ngFor="let f of filters" 
        class="hud-btn" 
        [ngClass]="{'active': activeFilter() === f.value}"
        (click)="setFilter(f.value)">
        [{{ f.label }}]
      </button>
    </div>
  </header>

  <div class="spotlight-grid" (mousemove)="onGridMouseMove($event)">
    <article 
      class="spotlight-card" 
      *ngFor="let p of filteredProjects(); let i = index" 
      #cardElement>
      
      <div class="card-border"></div>
      
      <div class="card-content">
        <div class="tech-deco">
          <span class="deco-id">OBJ_{{ i < 9 ? '0' + (i+1) : i+1 }}</span>
          <span class="deco-type" [ngClass]="p.type">{{ p.type === 'fe' ? 'UI/UX' : 'DATA' }}</span>
        </div>

        <h3 class="chroma-title" [attr.data-text]="p.title">{{ p.title }}</h3>
        
        <p class="card-desc">{{ p.description }}</p>

        <div class="tag-cluster">
          <span class="hud-tag" *ngFor="let t of p.tags">{{ t.label }}</span>
        </div>

        <div class="action-bar">
          <a [href]="p.repoUrl" target="_blank" class="action-link">
            <span class="bracket"><</span> SRC <span class="bracket">></span>
          </a>
          <a *ngIf="p.liveUrl" [href]="p.liveUrl" target="_blank" class="action-link">
            <span class="bracket"><</span> LIVE <span class="bracket">></span>
          </a>
          <button *ngIf="p.link" class="action-btn" (click)="openModal(p)">
            ACCESS_DATA
          </button>
        </div>
      </div>
    </article>
  </div>
</section>

<div *ngIf="activeModal() !== null" class="modal-backdrop" (click)="closeModal()">
  
  <button class="cyber-close-btn" (click)="closeModal()">
    <span class="btn-text">SYS_EXIT</span>
    <span class="btn-icon">[X]</span>
  </button>

  <div class="modal-container" (click)="$event.stopPropagation()">
    <app-adventureworks-detail *ngIf="activeModal() === 'adventureworks'" (close)="closeModal()" />
    <app-covid-detail *ngIf="activeModal() === 'covid'" (close)="closeModal()" />
    
    <app-customer-segmentation-detail *ngIf="activeModal() === 'customer-segmentation'" (close)="closeModal()" />
  </div>
</div>
