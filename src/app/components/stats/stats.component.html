<div class="stats-row">
  <div class="stat-card" *ngFor="let s of stats">
    <div class="stat-card__num">{{ s.value }}</div>
    <div class="stat-card__label">{{ s.label }}</div>
  </div>
</div>

<div class="ticker-wrap">
  <div class="ticker-track">
    <ng-container *ngFor="let _ of [0,1]">
      <span class="ticker-item" *ngFor="let item of tickerItems">
        {{ item }}<span class="ticker-dot">·</span>
      </span>
    </ng-container>
  </div>
</div>
